[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "NEXUS AI agent service — providers, memory, tools, planner"
requires-python = ">=3.10"
dependencies = []  # stdlib only in Phase 1; keyring/optional deps come later

[project.optional-dependencies]
secrets = ["keyring"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
